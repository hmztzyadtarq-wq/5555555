
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معسكر الـ 90 يوم - طارق وحازم</title>
    <style>
        :root {
            --primary: #6366f1;
            --accent: #f59e0b;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.08);
        }
        body { 
            background: radial-gradient(circle at top right, #0f172a, #1e1b4b, #090d16); 
            font-family: 'Segoe UI', sans-serif; color: #f8fafc; margin: 0; padding: 0; min-height: 100vh;
        }
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); 
            padding: 15px 40px; border-bottom: 1px solid var(--border);
        }
        .brand { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
        .user-tag { background: rgba(245, 158, 11, 0.15); padding: 4px 12px; border-radius: 20px; color: var(--accent); }
        .links a { color: #94a3b8; text-decoration: none; margin-right: 25px; font-weight: 700; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        /* 🛠️ لوحة المزامنة السحرية العبقرية */
        .sync-panel { background: rgba(245, 158, 11, 0.05); border: 1px dashed var(--accent); border-radius: 15px; padding: 15px; margin-bottom: 30px; display: flex; gap: 10px; align-items: center; }
        .sync-panel input { flex: 1; background: #070a12; border: 1px solid #334155; padding: 10px; color: white; border-radius: 8px; }

        /* 📅 كروت الأيام الملحمية */
        .day-card { background: var(--card-bg); backdrop-filter: blur(16px); border-radius: 20px; padding: 20px; margin-bottom: 25px; border: 1px solid var(--border); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
        .day-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; }
        .day-title { font-size: 1.2rem; font-weight: 800; color: #e2e8f0; }
        .day-date { color: var(--accent); font-weight: bold; }
        
        .task-input-zone { display: flex; gap: 10px; margin-bottom: 15px; }
        .task-input-zone input { flex: 1; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 10px; color: white; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-status { padding: 6px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; width: 100px; }
        .done { background: #10b981; color: white; }
        .not-done { background: #334155; color: #94a3b8; }
        button { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #ef4444; }
    </style>
</head>
<body>

<nav>
    <div class="brand">🚀 صالة معسكر الفرم <span class="user-tag" id="userTag">..</span></div>
    <div class="links">
        <a href="index.html" style="color:white; border-bottom: 2px solid var(--primary);">🏠 الجدول والأيام</a>
        <a href="meet.html">🎥 العداد والميت</a>
        <a href="login.html" style="color: #ef4444;">🚪 خروج</a>
    </div>
</nav>

<div class="container">

    <!-- 📲 لوحة المزامنة السحرية بدون سيرفر -->
    <div class="sync-panel">
        <button onclick="exportData()" style="background: var(--accent); color: #0f172a;">💾 نسخ كود التزامُن لإرساله لحازم</button>
        <input type="text" id="syncInput" placeholder="ضع هنا الكود المنسوخ من حازم للتحديث...">
        <button onclick="importData()">🔄 تحديث الجدول الآن</button>
    </div>

    <!-- مكان توليد كروت الأيام تلقائياً -->
    <div id="daysContainer"></div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const currentUser = params.get('user') || "طارق";
    document.getElementById('userTag').innerText = "الحساب الحالي: " + currentUser;

    // بنية البيانات الأساسية المخزنة محلياً لضمان الإضافة الفورية بدون تهنيج السيرفرات
    let campData = JSON.parse(localStorage.getItem('campData_2026')) || {};

    // توليد الأيام من اليوم (23 مايو) وحتى ليلة الامتحان (21 يونيو)
    function generateDays() {
        const container = document.getElementById('daysContainer');
        container.innerHTML = '';
        
        let startDate = new Date('2026-05-23');
        const endDate = new Date('2026-06-21');
        
        let dayCounter = 1;

        while (startDate <= endDate) {
            const dateStr = startDate.toISOString().split('T')[0];
            const formattedDate = startDate.toLocaleDateString('ar-EG', { weekday: 'long', month: 'numeric', day: 'numeric' });
            
            // إذا لم يكن اليوم موجوداً في البيانات، نقوم بإنشائه فارغاً
            if (!campData[dateStr]) {
                campData[dateStr] = [];
            }

            let rowsHtml = '';
            campData[dateStr].forEach((task, index) => {
                rowsHtml += `
                    <tr>
                        <td style="text-align:right; font-weight:600;">${task.name}</td>
                        <td><button class="btn-status ${task.tareq ? 'done' : 'not-done'}" onclick="toggleTask('${dateStr}', ${index}, 'tareq')">${task.tareq ? 'تم ✅' : '❌'}</button></td>
                        <td><button class="btn-status ${task.hazem ? 'done' : 'not-done'}" onclick="toggleTask('${dateStr}', ${index}, 'hazem')">${task.hazem ? 'تم ✅' : '❌'}</button></td>
                        <td><button class="btn-danger" style="padding:4px 8px; font-size:0.8rem;" onclick="deleteTask('${dateStr}', ${index})">🗑️</button></td>
                    </tr>
                `;
            });

            container.innerHTML += `
                <div class="day-card">
                    <div class="day-header">
                        <div class="day-title">اليوم ${dayCounter} - ${formattedDate}</div>
                        <div class="day-date">${dateStr}</div>
                    </div>
                    <div class="task-input-zone">
                        <input type="text" id="input-${dateStr}" placeholder="اكتب اسم المهمة هنا لهذا اليوم...">
                        <button onclick="addTask('${dateStr}')">إضافة مهمة 🚀</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align:right;">المهمة</th>
                                <th>إنجاز طارق</th>
                                <th>إنجاز حازم</th>
                                <th>حذف</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
            `;

            startDate.setDate(startDate.getDate() + 1);
            dayCounter++;
        }
        localStorage.setItem('campData_2026', JSON.stringify(campData));
    }

    // إضافة مهمة لليوم المحدد
    function addTask(dateStr) {
        const input = document.getElementById(`input-${dateStr}`);
        const taskName = input.value.trim();
        if (!taskName) return;

        campData[dateStr].push({
            name: taskName,
            tareq: false,
            hazem: false
        });
        
        input.value = '';
        generateDays();
    }

    // تفعيل التم واللا تم مع حماية الحسابات
    function toggleTask(dateStr, index, userField) {
        const myField = (currentUser === "طارق") ? "tareq" : "hazem";
        if (userField !== myField) {
            alert("يا بطل! دي خانة زميلك، ركز في فرم مادتك 😅💪");
            return;
        }
        campData[dateStr][index][userField] = !campData[dateStr][index][userField];
        generateDays();
    }

    // حذف مهمة
    function deleteTask(dateStr, index) {
        if (confirm("حذف المهمة؟")) {
            campData[dateStr].splice(index, 1);
            generateDays();
        }
    }

    // 💾 تصدير البيانات ومشاركتها (المزامنة السحرية الشغالة 100%)
    function exportData() {
        const dataStr = btoa(unescape(encodeURIComponent(JSON.stringify(campData))));
        navigator.clipboard.writeText(dataStr);
        alert("تم نسخ كود التزامن بنجاح! ابعته لحازم في رسالة، ولما يحطه عنده هيشوف جدولك فوراً.");
    }

    // 🔄 استيراد البيانات وتحديثها من الطرف الآخر
    function importData() {
        const code = document.getElementById('syncInput').value.trim();
        if (!code) { alert("من فضلك حط الكود الأول!"); return; }
        try {
            const decodedData = JSON.parse(decodeURIComponent(escape(atob(code))));
            campData = decodedData;
            localStorage.setItem('campData_2026', JSON.stringify(campData));
            generateDays();
            document.getElementById('syncInput').value = '';
            alert("تم تحديث الجدول ومزامنته مع حازم بنجاح! ⚡");
        } catch (e) {
            alert("الكود غير صحيح، تأكد انك نسخته كامل.");
        }
    }

    // تشغيل الجدول فور فتح الصفحة
    generateDays();
</script>
</body>
</html>
