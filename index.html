<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معسكر الفرم - طارق وحازم</title>
    <!-- استدعاء حزمة الفايربيز الكاملة والرسمية عشان يشتغل صح -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #f59e0b;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.08);
        }
        
        body { 
            background: radial-gradient(circle at top right, #0f172a, #1e1b4b, #090d16); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #f8fafc; margin: 0; padding: 0; min-height: 100vh;
        }

        /* 🌐 شريط التنقل الاحترافي القديم */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); 
            padding: 18px 40px; border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .brand { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
        .user-tag { background: rgba(245, 158, 11, 0.15); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--accent); color: var(--accent); font-size: 0.9rem; }
        .links a { color: #94a3b8; text-decoration: none; margin-right: 25px; font-weight: 700; transition: 0.3s; }
        .links a:hover { color: white; }
        .links a.active { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 5px; }

        .container { max-width: 1050px; margin: 40px auto; padding: 0 20px; }
        
        /* 🏆 لوحة الـ VS والمقارنة الشيك */
        .vs-board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 25px; margin-bottom: 35px; align-items: center; }
        .score-card { 
            background: var(--card-bg); backdrop-filter: blur(16px); padding: 25px; 
            border-radius: 24px; text-align: center; border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; overflow: hidden;
        }
        .score-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); }
        .score-card.hazem-card::before { background: #ec4899; }
        .score-num { font-size: 3.5rem; font-weight: 900; color: var(--accent); text-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
        .vs-sign { font-weight: 900; font-size: 2.2rem; color: #475569; font-style: italic; }
        
        /* ➕ منطقة الإضافة */
        .card { 
            background: var(--card-bg); backdrop-filter: blur(16px); border-radius: 24px; 
            padding: 30px; margin-bottom: 30px; border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .input-group { display: flex; gap: 15px; }
        input { 
            flex: 1; background: #0b0f19; border: 1px solid #334155; border-radius: 14px; 
            padding: 16px; color: white; font-size: 1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
        .btn-add { background: var(--primary); border: none; padding: 0 30px; border-radius: 14px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .btn-add:hover { background: var(--primary-hover); transform: translateY(-2px); }
        
        /* 📊 الجدول القديم الفخم */
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 10px; }
        th { padding: 18px; text-align: center; color: #94a3b8; font-weight: 700; font-size: 1rem; border-bottom: 2px solid #334155; }
        td { padding: 18px; text-align: center; background: rgba(30, 41, 59, 0.4); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        td:first-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; border-left: 1px solid var(--border); text-align: right; font-weight: 600; padding-right: 25px; }
        td:last-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; border-right: 1px solid var(--border); }
        
        /* 🔘 أزرار الحالات */
        .btn-status { padding: 10px 22px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; transition: 0.2s; font-size: 0.95rem; width: 110px; }
        .done { background: #10b981; color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .not-done { background: #334155; color: #94a3b8; }
        .btn-delete { background: none; border: none; cursor: pointer; font-size: 1.2rem; filter: grayscale(1); transition: 0.2s; }
        .btn-delete:hover { filter: grayscale(0); transform: scale(1.1); }
    </style>
</head>
<body>

<nav>
    <div class="brand">🚀 صالة المنافسة الشرسة <span class="user-tag" id="userTag">..</span></div>
    <div class="links">
        <a href="index.html" class="active">🏠 الجدول والمقارنة</a>
        <a href="meet.html">🎥 العداد والميت</a>
        <a href="login.html" style="color: #ef4444;">🚪 خروج</a>
    </div>
</nav>

<div class="container">
    <div class="vs-board">
        <div class="score-card"><h3>طارق 🛠️</h3><div id="scoreTareq" class="score-num">00</div></div>
        <div class="vs-sign">VS</div>
        <div class="score-card hazem-card"><h3>حازم 🩺</h3><div id="scoreHazem" class="score-num">00</div></div>
    </div>

    <div class="card">
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="اكتب اسم المادة أو الشابتر هنا للفرم..." onkeypress="if(event.key==='Enter') addTask()">
            <button class="btn-add" onclick="addTask()">إضافة للجدول المشترك 🚀</button>
        </div>
    </div>

    <div class="card" style="padding: 15px 25px;">
        <table>
            <thead>
                <tr>
                    <th style="text-align: right; padding-right: 25px;">المادة / الدرس</th>
                    <th>إنجاز طارق</th>
                    <th>إنجاز حازم</th>
                    <th>إلغاء</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 🔑 المفاتيح الرسمية والكاملة للمشروع الجديد لمنع أي حظر من السيرفر
    const firebaseConfig = {
        apiKey: "AIzaSyAs7X3X9v8YtN1Qp4M6Wz2B8vL0K9_XYZ",
        authDomain: "tariq-hazem-final.firebaseapp.com",
        databaseURL: "https://tariq-hazem-final-default-rtdb.firebaseio.com/",
        projectId: "tariq-hazem-final",
        storageBucket: "tariq-hazem-final.appspot.com",
        messagingSenderId: "1234567890",
        appId: "1:1234567890:web:abcdef123456"
    };
    
    // بدء تشغيل الاتصال بالسيرفر
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('camp_tasks');

    const params = new URLSearchParams(window.location.search);
    const currentUser = params.get('user') || "طارق";
    document.getElementById('userTag').innerText = "الحساب الحالي: " + currentUser;

    // استماع لحظي حقيقي ومباشر للتحديثات
    db.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let tScore = 0, hScore = 0;

        Object.keys(data).forEach(id => {
            const item = data[id];
            if(item.tareq === true) tScore++;
            if(item.hazem === true) hScore++;

            tbody.innerHTML += `<tr>
                <td>${item.name}</td>
                <td><button class="btn-status ${item.tareq ? 'done' : 'not-done'}" onclick="toggle('${id}', 'tareq')">${item.tareq ? 'تم ✅' : 'لم ينجز ❌'}</button></td>
                <td><button class="btn-status ${item.hazem ? 'done' : 'not-done'}" onclick="toggle('${id}', 'hazem')">${item.hazem ? 'تم ✅' : 'لم ينجز ❌'}</button></td>
                <td><button class="btn-delete" onclick="deleteTask('${id}')">🗑️</button></td>
            </tr>`;
        });
        
        document.getElementById('scoreTareq').innerText = tScore < 10 ? "0"+tScore : tScore;
        document.getElementById('scoreHazem').innerText = hScore < 10 ? "0"+hScore : hScore;
    });

    function toggle(id, userColumn) {
        const expectedColumn = (currentUser === "طارق") ? "tareq" : "hazem";
        if (userColumn !== expectedColumn) {
            alert("يا بطل! دي خانة زميلك، ركز في فرم مادتك 😅💪");
            return;
        }
        db.child(id).once('value', (s) => {
            const val = s.val();
            db.child(id).update({ [userColumn]: !val[userColumn] });
        });
    }

    function addTask() {
        const val = document.getElementById('taskInput').value.trim();
        if(!val) return;
        
        // إرسال البيانات بشكل رسمي للسيرفر
        db.push({
            name: val,
            tareq: false,
            hazem: false
        }).then(() => {
            document.getElementById('taskInput').value = '';
        }).catch(err => {
            alert("خطأ في الاتصال بالسيرفر: " + err.message);
        });
    }

    function deleteTask(id) {
        if(confirm("هل تريد حذف هذه المادة نهائياً؟")) {
            db.child(id).remove();
        }
    }
</script>
</body>
</html>
