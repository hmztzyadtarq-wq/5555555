<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بنك المهام والمنافسة الشرسة</title>
    <!-- مكتبة Firebase للمزامنة اللحظية -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: radial-gradient(circle at top right, #0f172a, #1e1b4b); font-family: 'Segoe UI', sans-serif; color: #f8fafc; margin: 0; padding: 0; }
        nav { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); padding: 15px 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .brand { font-weight: 800; color: #f59e0b; }
        .links a { color: #94a3b8; text-decoration: none; margin-right: 20px; font-weight: 700; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        /* 🏆 لوحة المقارنة */
        .vs-board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; margin-bottom: 30px; align-items: center; }
        .score-card { background: rgba(30, 41, 59, 0.6); padding: 20px; border-radius: 20px; text-align: center; border: 1px solid #334155; }
        .score-num { font-size: 2.5rem; font-weight: 900; color: #f59e0b; }
        
        .card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border-radius: 20px; padding: 25px; margin-bottom: 25px; border: 1px solid #334155; }
        .input-group { display: flex; gap: 10px; margin-top: 15px; }
        input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; }
        button { background: #6366f1; border: none; padding: 0 25px; border-radius: 10px; color: white; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #334155; }
        .btn-status { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .done { background: #10b981; color: white; }
        .not-done { background: #334155; color: #94a3b8; }
    </style>
</head>
<body>

<nav>
    <div class="brand">🚀 صالة المنافسة الشرسة | مرحباً <span id="userName">..</span></div>
    <div class="links">
        <a href="index.html">🏠 الجدول</a>
        <a href="meet.html">🎥 العداد والميت</a>
        <a href="login.html" style="color: #ef4444;">🚪 خروج</a>
    </div>
</nav>

<div class="container">
    <div class="vs-board">
        <div class="score-card"><h3>طارق 🛠️</h3><div id="scoreTareq" class="score-num">00</div></div>
        <div style="font-weight:900; font-size: 2rem;">VS</div>
        <div class="score-card"><h3>حازم 🩺</h3><div id="scoreHazem" class="score-num">00</div></div>
    </div>

    <div class="card">
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="أضف مادة للجدول...">
            <button onclick="addTask()">إضافة للمستودع 🚀</button>
        </div>
    </div>

    <div class="card">
        <table>
            <thead><tr><th>المادة</th><th>إنجاز طارق</th><th>إنجاز حازم</th><th>حذف</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // إعداد Firebase (مزامنة لحظية)
    const firebaseConfig = { databaseURL: "https://tariq-hazem-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('tasks');

    const params = new URLSearchParams(window.location.search);
    const currentUser = params.get('user') || "طارق";
    document.getElementById('userName').innerText = currentUser;

    // تحديث البيانات لحظياً
    db.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let tScore = 0, hScore = 0;

        Object.keys(data).forEach(id => {
            const item = data[id];
            if(item.tareq) tScore++;
            if(item.hazem) hScore++;

            tbody.innerHTML += `<tr>
                <td style="font-weight:bold">${item.name}</td>
                <td><button class="btn-status ${item.tareq ? 'done' : 'not-done'}" onclick="toggle('${id}', 'tareq')">${item.tareq ? 'تم ✅' : '❌'}</button></td>
                <td><button class="btn-status ${item.hazem ? 'done' : 'not-done'}" onclick="toggle('${id}', 'hazem')">${item.hazem ? 'تم ✅' : '❌'}</button></td>
                <td><button onclick="deleteTask('${id}')" style="background:none; border:none; cursor:pointer;">🗑️</button></td>
            </tr>`;
        });
        document.getElementById('scoreTareq').innerText = tScore < 10 ? "0"+tScore : tScore;
        document.getElementById('scoreHazem').innerText = hScore < 10 ? "0"+hScore : hScore;
    });

    function toggle(id, user) {
        if (user !== (currentUser === "طارق" ? "tareq" : "hazem")) {
            alert("يا بطل! ممنوع تلمس شغل زميلك 😅");
            return;
        }
        db.child(id).once('value', (s) => {
            const val = s.val();
            db.child(id).update({ [user]: !val[user] });
        });
    }

    function addTask() {
        const val = document.getElementById('taskInput').value;
        if(!val) return;
        db.push({ name: val, tareq: false, hazem: false });
        document.getElementById('taskInput').value = '';
    }

    function deleteTask(id) {
        if(confirm("مسح المهمة نهائياً؟")) db.child(id).remove();
    }
</script>
</body>
</html>
