<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حلبة التحدي والمنافسة</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        input { width: 60%; padding: 10px; border-radius: 8px; border: none; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: #6366f1; color: white; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; border-radius: 15px; overflow: hidden; }
        th, td { padding: 15px; border-bottom: 1px solid #334155; }
        .done { background: #10b981 !important; }
        .btn-status { width: 100px; padding: 5px; background: #475569; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>أهلاً بك يا <span id="userName">..</span></h2>
    <div class="card">
        <input type="text" id="taskInput" placeholder="اسم المادة الجديدة...">
        <button onclick="addTask()">إضافة للمستودع</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>المادة</th>
                <th>إنجاز طارق</th>
                <th>إنجاز حازم</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const API_URL = "https://sheetdb.io/api/v1/cbzh9fqp3s9o4";
    const currentUser = localStorage.getItem('currentUser') || "طارق"; // تأكد إنك مظبط ده في صفحة اللوجين
    document.getElementById('userName').innerText = currentUser;

    async function fetchData() {
        const res = await fetch(API_URL);
        const data = await res.json();
        renderTable(data);
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        data.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.المادة}</td>
                    <td><button class="btn-status ${item.إنجاز_طارق === 'TRUE' ? 'done' : ''}" onclick="toggle('إنجاز_طارق', '${item.المادة}')">${item.إنجاز_طارق === 'TRUE' ? '✅ تم' : '❌ لا'}</button></td>
                    <td><button class="btn-status ${item.إنجاز_حازم === 'TRUE' ? 'done' : ''}" onclick="toggle('إنجاز_حازم', '${item.المادة}')">${item.إنجاز_حازم === 'TRUE' ? '✅ تم' : '❌ لا'}</button></td>
                </tr>
            `;
        });
    }

    async function toggle(column, taskName) {
        // قفل أمان: طارق ميعلمش لحازم والعكس
        const myName = currentUser.includes("طارق") ? "إنجاز_طارق" : "إنجاز_حازم";
        if(column !== myName) {
            alert("ممنوع تلمس خانة زميلك!");
            return;
        }

        // جلب الحالة الحالية
        const res = await fetch(`${API_URL}/المادة/${taskName}`);
        const data = await res.json();
        const newState = data[0][column] === 'TRUE' ? 'FALSE' : 'TRUE';

        await fetch(`${API_URL}/المادة/${taskName}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ [column]: newState })
        });
        fetchData();
    }

    async function addTask() {
        const task = document.getElementById('taskInput').value;
        if(!task) return;
        await fetch(API_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ "المادة": task, "إنجاز_طارق": "FALSE", "إنجاز_حازم": "FALSE" })
        });
        document.getElementById('taskInput').value = '';
        fetchData();
    }

    setInterval(fetchData, 3000);
    fetchData();
</script>
</body>
</html>
