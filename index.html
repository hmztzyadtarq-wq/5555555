
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك المهام المشترك والسرّي</title>
    <style>
        body {
            background: radial-gradient(circle at top right, #0f172a, #1e1b4b);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f8fafc; margin: 0; padding: 0;
        }
        nav {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            padding: 15px 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .brand span { color: #f59e0b; font-weight: 800; }
        .links a { color: #94a3b8; text-decoration: none; margin-right: 20px; font-weight: 700; }
        .links a.active { color: #6366f1; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.7));
            backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }
        .input-group { display: flex; gap: 10px; margin-top: 15px; }
        .input-group input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; font-size: 1rem; }
        .input-group button { background: #6366f1; border: none; padding: 0 25px; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; overflow: hidden; border-radius: 12px; }
        th, td { padding: 14px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: #1e293b; color: #94a3b8; font-weight: bold; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .status-btn { background: #334155; border: none; color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: all 0.2s; }
        .status-btn.done { background: #10b981; color: white; box-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .delete-btn { color: #ef4444; background: none; border: none; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        .sync-loader { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-bottom: 10px; }
        .creator-tag { font-size: 0.75rem; color: #64748b; display: block; margin-top: 2px; }
    </style>
</head>
<body>

    <nav>
        <div class="brand">🚀 بنك المهام والفرم المشترك | مرحباً <span id="welcomeUser">..</span></div>
        <div class="links">
            <a href="index.html" class="active">🏠 الجدول المشترك</a>
            <a href="meet.html">🎥 العداد المشترك والميت</a>
            <a href="login.html" style="color: #ef4444;">🚪 خروج</a>
        </div>
    </nav>

    <div class="container">
        <div class="sync-loader" id="syncStatus">جاري المزامنة مع السيرفر.. ⏳</div>

        <!-- خانة إضافة مادة -->
        <div class="card">
            <h2 style="margin-top:0; color:#f59e0b;">➕ إضافة مهمة جديدة للجميع</h2>
            <p style="margin: -10px 0 15px 0; font-size: 0.85rem; color: #94a3b8;">أي مهمة هتضيفها هنا هتظهر عندك وعند حازم فوراً، وكل واحد يخلصها في سرّية تامة! 🤫</p>
            <div class="input-group">
                <input type="text" id="subjectName" placeholder="اكتب المادة أو الدرس (مثلاً: فيزياء - حديثة)...">
                <button onclick="addSubject()">إضافة للجدول العام 🚀</button>
            </div>
        </div>

        <!-- جدول التحدي الحقيقي -->
        <div class="card">
            <h2 style="margin-top:0;">📋 قائمة المهام المشتركة</h2>
            <table>
                <thead>
                    <tr>
                        <th>المهمة / الدرس</th>
                        <th>حالة إنجازك أنت</th>
                        <th>التحكم العام</th>
                    </tr>
                </thead>
                <tbody id="subjectsTableBody">
                    <!-- البيانات هتنزل هنا لايف -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('currentUser')) { window.location.href = "login.html"; }
        const rawUser = localStorage.getItem('currentUser') || "طارق 🛠️";
        const myName = (rawUser.includes("طارق") || rawUser.includes("طارq")) ? "طارق" : "حازم";
        document.getElementById('welcomeUser').innerText = myName;

        const BIN_URL = "https://api.jsonbin.io/v3/b/664ec5b3e41b4d34e4fa4411";
        const API_KEY = "$2b$10$W7bO4S.Vptn6hJUnm/VTeOWeWb2P.qF1fL4UWhpOfb5D8IlyD36wW";

        let serverData = { tasks: [], timer: {}, chat: [], lastSeen: {}, diary: {} };
        let isUpdating = false;

        // جلب جدول التشغيل من المتصفح لمعرفة اللي خلصته "أنت بس"
        function getMyFinishedTasks() {
            const key = `finished_tasks_${myName}`;
            return JSON.parse(localStorage.getItem(key)) || [];
        }

        function saveMyFinishedTasks(list) {
            const key = `finished_tasks_${myName}`;
            localStorage.setItem(key, JSON.stringify(list));
        }

        // 📥 جلب الجدول المشترك من السيرفر
        function fetchData() {
            if (isUpdating) return;
            fetch(BIN_URL, { method: 'GET', headers: { "X-Master-Key": API_KEY, "X-Bin-Meta": "false" } })
            .then(res => res.json())
            .then(data => {
                if (data && !isUpdating) {
                    serverData = data;
                    serverData.tasks = data.tasks || []; 
                    renderTable();
                    document.getElementById('syncStatus').innerText = "تم التحديث والمزامنة لايف 🟢";
                }
            })
            .catch(e => { document.getElementById('syncStatus').innerText = "مشكلة في الاتصال بالسيرفر.. 🔴"; });
        }

        // 🛠️ إضافة مهمة تظهر للاتنين
        function addSubject() {
            const nameInput = document.getElementById('subjectName');
            const name = nameInput.value.trim();
            if (!name) return;

            isUpdating = true;
            document.getElementById('syncStatus').innerText = "جاري الرفع للجميع.. ⏳";

            serverData.tasks.push({
                id: "task_" + Date.now() + "_" + Math.floor(Math.random()*1000),
                title: name,
                creator: myName
            });

            pushToCloud(() => {
                nameInput.value = '';
                isUpdating = false;
                fetchData();
            });
        }

        // 🤫 علم على مادة إنها خلصت (عندي أنا بس!)
        function toggleMyComplete(id) {
            let finished = getMyFinishedTasks();
            if (finished.includes(id)) {
                // لو كانت مخلصة وعايز يرجعها جاري العمل
                finished = finished.filter(item => item !== id);
            } else {
                // علم عليها مخلصة
                finished.push(id);
            }
            saveMyFinishedTasks(finished);
            renderTable(); // رندر فوراً محلياً عشان السرعة
        }

        // ❌ مسح مادة من الجدول العام للاتنين (تعديل متاح للطرفين)
        function deleteSubject(id) {
            if(!confirm("⚠️ مسح المهمة دي هيشيلها من عندك ومن عند زميلك برضه. متأكد؟")) return;
            isUpdating = true;
            serverData.tasks = serverData.tasks.filter(t => t.id !== id);

            pushToCloud(() => {
                isUpdating = false;
                fetchData();
            });
        }

        // 🎨 رسم الجدول بناء على السيرفر + الـ LocalStorage السري بتاعك
        function renderTable() {
            const tbody = document.getElementById('subjectsTableBody');
            tbody.innerHTML = '';
            
            const myFinished = getMyFinishedTasks();

            serverData.tasks.forEach(task => {
                const isDoneByMe = myFinished.includes(task.id);
                const statusText = isDoneByMe ? "منتهية عندك ومخفية عن زميلك ✅" : "جاري الفرم.. 📚";
                const btnClass = isDoneByMe ? "status-btn done" : "status-btn";

                tbody.innerHTML += `
                    <tr>
                        <td style="${isDoneByMe ? 'text-decoration: line-through; color: #64748b; font-weight: normal;' : 'font-weight: bold;'}">
                            ${task.title}
                            <span class="creator-tag">بواسطة: ${task.creator}</span>
                        </td>
                        <td><button class="${btnClass}" onclick="toggleMyComplete('${task.id}')">${statusText}</button></td>
                        <td><button class="delete-btn" onclick="deleteSubject('${task.id}')" title="حذف المهمة نهائياً للجميع">🗑️</button></td>
                    </tr>
                `;
            });
        }

        function pushToCloud(callback) {
            fetch(BIN_URL, {
                method: 'PUT', headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY }, body: JSON.stringify(serverData)
            })
            .then(() => { if(callback) callback(); })
            .catch(e => { isUpdating = false; });
        }

        window.onload = function() {
            fetchData();
            setInterval(fetchData, 4000); // تحديث كل 4 ثواني عشان لو حد ضاف مادة تظهر للتاني لايف
        };
    </script>
</body>
</html>
